<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">

    <title>Group Finder</title>

    <!-- Google Font -->
    <link rel="preconnect" href="https://fonts.googleapis.com">
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
    <link
        href="https://fonts.googleapis.com/css2?family=Urbanist:wght@400;500;600;700;800;900&display=swap"
        rel="stylesheet"
    >

    <link rel="stylesheet" href="style.css">
</head>

<body>

    <main class="container">

        <!-- Header -->
        <header class="header">
            <div>
                <p class="eyebrow">GROUP FINDER</p>
                <h1>Find Your Group</h1>
                <p class="subtitle">
                    Enter your last name to discover your assigned group.
                </p>
            </div>

            <button
                id="themeToggle"
                class="theme-toggle"
                type="button"
                aria-label="Toggle dark mode"
            >
                <span id="themeIcon">☾</span>
            </button>
        </header>

        <!-- Search -->
        <section class="search-section">

            <label for="lastName">
                Last Name
            </label>

            <div class="search-box">
                <input
                    type="text"
                    id="lastName"
                    placeholder="Enter your last name..."
                    autocomplete="off"
                    spellcheck="false"
                >

                <button
                    id="searchBtn"
                    type="button"
                >
                    Search
                </button>
            </div>

        </section>

        <!-- Result -->
        <section
            id="result"
            class="result"
            aria-live="polite"
        >
            <div class="result-content">
                <span class="result-icon">⌕</span>

                <span class="result-message">
                    Type your last name above
                </span>
            </div>
        </section>

        <!-- Groups -->
        <section class="groups-section">

            <div class="section-heading">
                <div>
                    <p class="eyebrow">OVERVIEW</p>
                    <h2>Group Distribution</h2>
                </div>
            </div>

            <div class="groups-grid">

                <div class="group-card">
                    <span class="group-number">G1</span>
                    <span class="group-arrow">→</span>
                    <span class="group-range">AMEN</span>
                </div>

                <div class="group-card">
                    <span class="group-number">G2</span>
                    <span class="group-arrow">→</span>
                    <span class="group-range">BOUH</span>
                </div>

                <div class="group-card">
                    <span class="group-number">G3</span>
                    <span class="group-arrow">→</span>
                    <span class="group-range">EL H</span>
                </div>

                <div class="group-card">
                    <span class="group-number">G4</span>
                    <span class="group-arrow">→</span>
                    <span class="group-range">FARR</span>
                </div>

                <div class="group-card">
                    <span class="group-number">G5</span>
                    <span class="group-arrow">→</span>
                    <span class="group-range">KARS</span>
                </div>

                <div class="group-card">
                    <span class="group-number">G6</span>
                    <span class="group-arrow">→</span>
                    <span class="group-range">OUBA</span>
                </div>

                <div class="group-card">
                    <span class="group-number">G7</span>
                    <span class="group-arrow">→</span>
                    <span class="group-range">OUbA+</span>
                </div>

            </div>

        </section>

        <!-- Footer -->
        <footer class="footer">
            <p>
                © 2026 Group Finder
            </p>

            <p>
                Created by
                <a
                    href="https://github.com/u0ke"
                    target="_blank"
                    rel="noopener noreferrer"
                >
                    Hamza
                </a>
            </p>
        </footer>

    </main>

    <script src="script.js"></script>

</body>
</html>
